{% extends "admin/layout.html" %}
{% block admin_content %}
<h3 class="mb-4">Admin Dashboard</h3>
<div class="row g-3">
  <div class="col-12 col-md-6 col-lg-4">
    <a href="/admin/accounts" class="text-decoration-none">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-people me-2"></i>Accounts</h5>
          <p class="card-text text-muted">View accounts, manage admins, and delete users.</p>
        </div>
      </div>
    </a>
  </div>
  <div class="col-12 col-md-6 col-lg-4">
    <a href="/admin/models" class="text-decoration-none">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-cpu me-2"></i>Models</h5>
          <p class="card-text text-muted">Inspect language model status and load or unload them.</p>
        </div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
