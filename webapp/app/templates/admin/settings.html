{% extends "admin/layout.html" %}
{% block admin_content %}
<h3 class="mb-4">General Settings</h3>

<div id="settings-card" class="card" style="max-width: 36rem">
  <div class="card-body">
    <form id="settings-form">
      <div class="mb-3">
        <label for="max-upload-kb" class="form-label fw-semibold">Maximum upload size</label>
        <div class="input-group" style="max-width: 16rem">
          <input type="number" class="form-control" id="max-upload-kb" name="max_upload_kb"
                 min="1" step="1" value="{{ max_upload_kb }}" required>
          <span class="input-group-text">KB</span>
        </div>
        <div class="form-text">The largest subtitle file a user may upload for analysis.</div>
      </div>
      <div class="mb-3">
        <label for="github-url" class="form-label fw-semibold">GitHub link</label>
        <input type="url" class="form-control" id="github-url" name="github_url"
               placeholder="https://github.com/owner/repo" value="{{ github_url_setting }}">
        <div class="form-text">Shown as a GitHub icon in the navbar. Leave empty to hide it.</div>
      </div>
      <div id="settings-actions" class="d-flex align-items-center gap-3">
        <button type="submit" class="btn btn-primary" id="settings-save">Save</button>
        <span id="settings-status" class="small"></span>
      </div>
    </form>
  </div>
</div>
{% endblock %}
