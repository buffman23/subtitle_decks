{% extends "base.html" %}
{% block title %}Admin — Subtitle Decks{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="row">
    <nav class="col-12 col-md-3 col-lg-2 bg-light border-end py-3" style="min-height: calc(100vh - 56px)">
      <div class="px-3 mb-2 text-muted text-uppercase small fw-semibold">Admin</div>
      <ul class="nav nav-pills flex-column px-2">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == 'index' }}" href="/admin">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == 'accounts' }}" href="/admin/accounts">
            <i class="bi bi-people me-2"></i>Accounts
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == 'models' }}" href="/admin/models">
            <i class="bi bi-cpu me-2"></i>Models
          </a>
        </li>
      </ul>
    </nav>
    <main class="col py-4 px-4">
      {% block admin_content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ asset_url('js/admin.js') }}"></script>
{% endblock %}
