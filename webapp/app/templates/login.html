{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}

  <div class="row justify-content-center">
    <div class="col-md-4 text-center">
      <h2 class="mb-4">Sign In</h2>

    </div>
  </div>
</div>
{% endblock %}
